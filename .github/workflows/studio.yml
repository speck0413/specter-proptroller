# Specter Studio (studio/): the tests, the Playwright e2e run, and the installers for Windows, macOS and Linux,
# built natively on GitHub's runners (Tauri cannot build macOS apps on Linux, and its Windows cross build is
# NSIS-only and needs the Microsoft SDK licence). Unsigned by default; see studio/docs/BUILDING.md for the signing
# secrets.
# - The tests and e2e run on changes to studio/ and to firmware/ (Studio builds the simulator from firmware/ and
#   reads its golden sets and shared web modules). The installers run only when studio/ (or this file) changed,
#   on a studio-v* tag, or by hand: a firmware-only change does not build them.
# - A pushed tag studio-v<version> (the version in studio/package.json, studio/src-tauri/tauri.conf.json and
#   studio/Cargo.toml) puts the installers on that tag's GitHub release (a pre-release when the version has a
#   "-", e.g. studio-v0.1.0-rc.3). Firmware releases use v<firmware/VERSION> tags (firmware-release.yml).
# Action versions are pinned by commit SHA (tag in the comment).
name: studio

on:
  push:
    branches: [main]
    tags: ['studio-v*']
    paths: ['studio/**', 'firmware/**', 'docs/wiring-guides/html/**', '.github/workflows/studio.yml']
  pull_request:
    paths: ['studio/**', 'firmware/**', 'docs/wiring-guides/html/**', '.github/workflows/studio.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PLATFORMIO_VERSION: '6.2.0'

defaults:
  run:
    working-directory: studio

jobs:
  changes:
    name: what changed
    runs-on: ubuntu-24.04
    outputs:
      studio: ${{ steps.diff.outputs.studio }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Did studio/ change (installers)?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # a tag or a run by hand always builds the installers; so does a push whose previous commit is unknown
          range=""
          case "$EVENT" in
            pull_request) range="$BASE...$HEAD" ;;
            push) if [ "$REF_TYPE" = branch ]; then range="$BEFORE..$GITHUB_SHA"; fi ;;
          esac
          studio=true
          if [ -n "$range" ] && files=$(git diff --name-only --no-renames "$range" 2>/dev/null); then
            if ! printf '%s\n' "$files" | grep -qE '^(studio/|\.github/workflows/studio\.yml$)'; then studio=false; fi
          fi
          echo "studio=$studio" >> "$GITHUB_OUTPUT"
          echo "installers: $studio (range: ${range:-none})"

  test:
    name: tests (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag matches Studio's version
        if: startsWith(github.ref, 'refs/tags/studio-v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pkg=$(node -p "require('./package.json').version")
          tauri=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          for v in "$pkg" "$tauri" "$cargo"; do
            if [ "$TAG" != "studio-v$v" ]; then
              echo "::error::tag $TAG does not match Studio's version (package.json $pkg, tauri.conf.json $tauri, Cargo.toml $cargo)"
              exit 1
            fi
          done
      - name: Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libdbus-1-dev pkg-config libclang-dev
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: 'studio -> target'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/arduino/platformio.ini') }}
      - name: PlatformIO
        run: pip install "platformio==$PLATFORMIO_VERSION"
      - run: npm ci
      - name: npm test (effect blocks, language, C++ preview)
        run: npm test
      - name: Frontend build (the Tauri crate embeds dist/)
        run: npm run build
      - name: Simulated board
        run: ./scripts/build-sim.sh
      - name: cargo test (device layer against the real simulated board; includes a real firmware build)
        run: cargo test --workspace

  e2e:
    name: e2e (Playwright, Chrome, Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libdbus-1-dev pkg-config libclang-dev
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: 'studio -> target'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/arduino/platformio.ini') }}
      - name: PlatformIO
        run: pip install "platformio==$PLATFORMIO_VERSION"
      - run: npm ci
      - name: Simulated board
        run: ./scripts/build-sim.sh
      - name: Bridge (built before the tests so its first start fits the web server timeout)
        run: cargo build -q -p studio-core --bin bridge
      - name: Playwright (studio/tests/e2e; Google Chrome from the runner image)
        env:
          CHROMIUM: /usr/bin/google-chrome
        # --retries=1: the tests drive real simulated boards and a real bridge with wall-clock waits, so a test
        # that passes on its second try is reported as "flaky" in the summary instead of failing the job; a test
        # that fails twice still fails it. The installers do not wait for this job.
        run: npx playwright test --retries=1 --reporter=line
      - name: Playwright traces and screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results
          path: studio/test-results
          if-no-files-found: ignore
          retention-days: 7

  installers:
    name: installers (${{ matrix.name }})
    needs: [changes, test]
    if: needs.changes.outputs.studio == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-22.04 # the oldest supported glibc, so the .deb and AppImage run on more systems
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            sim: true
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            sim: false # the simulator has no Windows network layer yet (see studio/docs/BUILDING.md)
          - name: macOS Apple silicon
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            sim: true
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
            sim: true
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: studio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # libclang: core builds the C littlefs with bindgen (studio/docs/BUILDING.md). Windows runners have LLVM
      # installed, macOS runners Xcode's libclang, Linux gets libclang-dev with the packages below
      - name: libclang for bindgen (Windows)
        if: runner.os == 'Windows'
        run: |
          if [ ! -f "C:/Program Files/LLVM/bin/libclang.dll" ]; then choco install -y llvm; fi
          echo "LIBCLANG_PATH=C:/Program Files/LLVM/bin" >> "$GITHUB_ENV"
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libdbus-1-dev pkg-config xdg-utils libclang-dev
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: 'studio -> target'
          key: ${{ matrix.target }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.sim
        with:
          python-version: '3.12'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.sim
        with:
          path: ~/.platformio
          key: pio-sim-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('firmware/arduino/platformio.ini') }}
      - run: npm ci
      - name: npm test
        run: npm test
      - name: Simulated board (sidecar named for ${{ matrix.target }})
        if: matrix.sim
        run: |
          pip install "platformio==$PLATFORMIO_VERSION"
          SIM_TARGET=${{ matrix.target }} ./scripts/build-sim.sh
      - name: Bundle without the simulator
        if: '!matrix.sim'
        run: |
          echo '{ "bundle": { "externalBin": [] } }' > src-tauri/tauri.nosim.conf.json
          echo "::warning::${{ matrix.name }}: no practice board in this installer (the simulator does not build on Windows yet)"
      - name: Generic firmware that comes with Studio (ESP32, Pico W, Pico 2 W)
        run: |
          mkdir -p src-tauri/bundled-firmware
          if command -v pio >/dev/null 2>&1; then python3 scripts/bundle-firmware.py --pico
          else echo "none" > src-tauri/bundled-firmware/none.txt; echo "::warning::${{ matrix.name }}: no PlatformIO here, so no bundled firmware in this installer"; fi
      - name: Wiring guides into the bundle (docs/wiring-guides/html)
        run: |
          rm -rf src-tauri/guides && mkdir -p src-tauri/guides
          cp -r ../docs/wiring-guides/html/. src-tauri/guides/
          echo "wiring guides: $(ls src-tauri/guides/*.html | wc -l) pages"
      - name: Signing secrets (only those that are set)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # an empty APPLE_CERTIFICATE would make the bundler try to import it, so only set what exists
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then
              { echo "$v<<EOF_$v"; printf '%s\n' "${!v}"; echo "EOF_$v"; } >> "$GITHUB_ENV"
            fi
          done
          # unsigned macOS apps are ad-hoc signed ("-") so they launch on Apple silicon after "Open anyway"
          if [ "$RUNNER_OS" = macOS ] && [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi
      - name: Tauri build
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # no tagName / releaseId: build only, nothing is published
          projectPath: studio
          args: >-
            --config src-tauri/tauri.bundle.conf.json
            ${{ !matrix.sim && '--config src-tauri/tauri.nosim.conf.json' || '' }}
            --target ${{ matrix.target }}
            --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: specter-studio-${{ matrix.target }}
          # the Cargo workspace is studio/, so bundles land in studio/target/, not studio/src-tauri/target/
          path: |
            studio/target/${{ matrix.target }}/release/bundle/deb/*.deb
            studio/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            studio/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            studio/target/${{ matrix.target }}/release/bundle/msi/*.msi
            studio/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    name: release (studio-v tags only)
    needs: installers
    if: startsWith(github.ref, 'refs/tags/studio-v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        working-directory: .
    steps:
      - name: Installers from this run onto the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh run download "$GITHUB_RUN_ID" --dir dist
          mkdir -p out
          find dist -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \) \
            -exec cp {} out/ \;
          (cd out && sha256sum -- * > SHA256SUMS.txt && ls -l)
          # studio-v0.1.0-rc.3 -> 0.1.0-rc.3; a version with a suffix is a GitHub pre-release
          version="${TAG#studio-v}"
          pre=""; case "$version" in *-*) pre="--prerelease";; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* $pre --verify-tag --title "Specter Studio $version" \
              --notes "Specter Studio $version: installers for Windows, macOS (Apple silicon and Intel) and Linux, built by the studio workflow. Unsigned: see studio/docs/BUILDING.md for the first-launch steps."
          fi

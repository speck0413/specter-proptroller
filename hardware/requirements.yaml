# Requirements for the Spectre Proptroller board, rev B (silkscreen "SPECTRE PROPTROLLER rev B"; rev A, the first ordered design, is described in hardware/README.md).
# `bin/aieda q hardware/board.ts reqs` traces each id to the constraints and checks that cover it.
status: draft
approval: pending

project: {name: spectre-proptroller, revision: B, purpose: "All-in-one, open-source prop and show controller on a plug-in MCU board (30-pin ESP32 DevKit or Raspberry Pi Pico family): 4 high-side DC outputs, 2 dry relays, trigger inputs, isolated contact outputs, pixel port, DFPlayer audio, expansion header", stage: prototype}

functions:
  - {id: F-1, description: "MCU: EITHER a 30-pin ESP32 DevKit V1 (2 x 1x15 sockets, 25.4 mm) OR a Raspberry Pi Pico / Pico W / Pico 2 / Pico 2 W (2 x 1x20 sockets, 17.78 mm) nested between the DevKit rows, antenna ends at the west edge; never both. Every function net reaches one DevKit pin and one Pico pin. No MCU, USB or 3V3 regulator on the PCB"}
  - {id: F-2, description: "OUT1-4: high-side 40 V P-FET (AO4485) switches passing VIN through (loads must match the supply), 2N7002 driver, 4.7k / 4.7k gate divider (VGS within +/-20 V at the TVS clamp), 4.7k pull-down, SS56 freewheel diode, LED per output. PWM about 1 kHz with soft start in firmware", performance: {metric: continuous current per output, value: 5, tol: "Rated for VIN 12-24 V (12 V is the primary use case; below 12 V, down to the 9 V minimum, derate: the OUT FETs see less gate drive and run hotter; owner 2026-10-20). 5 A continuous, and 7.5 A for 5 s at <=2 % duty, starting from idle (the FET cool) (e.g. once every 6 min; pending a first-board heat test at 12 V and 24 V from 5 A steady, neighbour OUT at 5 A, closed box: Tj extrapolated to 50 C <= 125 C, terminals <= 90 C); 10 A only as a start-up surge under ~1 s; board total <=10 A; barrel input <=5 A (use the terminal input above 5 A). Rev A and rev B. The old 7.5 A for 0.5 s was an inrush allowance carried from the original requirement, not a part limit; thermal basis in hardware/README.md", units: A}}
  - {id: F-3, description: "RLY1-2: SRD-05VDC-SL-C SPDT on +5 V coils, dry contacts COM/NO/NC. Rev B rating (owner 2026-10-20): 120 V AC 5 A resistive, 3 A inductive, or 28 V DC 10 A resistive per relay, worded RELAYS: 120VAC 5A (3A IND) / 28VDC 10A (owner 2026-10-20; on the silk at 1.5 mm, top and bottom); derate for DC motors and solenoids (the datasheet gives no DC inductive figure). Source: Songle SRD (T73) datasheet V1 (songlerelay.com) and the LCSC C35449 copy: 10 A 125 VAC, 7/10/15 A 250 VAC / 28 VDC resistive, max 277 VAC / 30 VDC, Form C 10 A to 30 VDC on the switching curve; UL 3 A 125 VAC inductive (the 3A IND figure); 28 VDC is the rated DC voltage, 30 VDC only the maximum switching voltage. The AC rating rests first on the relay coil-to-contact insulation (1500 VAC 1 min, basic), then on SAF-1 (3.0 mm contact-island clearance and the air-gap slots), a design margin, not a certified rating. No fuse on the board (AR-1): a 5 A fuse goes in each relay's COM wire, user-installed, off the board. Rev A stays <=30 V DC only, 10 A: rev A is <=30 V DC rated; AC on rev A relays is experimental, for prove-out only, not considered safe, and recommended against until rev B. LED per relay. No snubber and no flyback footprint on the board (rev B; the DNP snubber was removed 2026-10-20 after the review measured the COM track 0.625 mm from its bare pads): snubber at the load if needed, DC only; an inductive load gets its flyback diode fitted at the load. The recommended way to switch AC loads is off the board with a listed relay-controlled outlet (docs/ac-control.md)"}
  - {id: F-4, description: "TRIG1 / TRIG2 inputs on 3.5 mm TRS: tip = signal (4.7k series, 4.7k pull-up to 3V3, 1N4148W clamp, 100 nF), ring = +3V3 through 220R (powers a small sensor, survives a short), sleeve = GND"}
  - {id: F-5, description: "CONTACT1-2 isolated contact-closure outputs on 3.5 mm TRS: LTV-217 optocoupler (<=30 V, <=50 mA), tip = +, sleeve = -. Used to trigger other controllers or devices"}
  - {id: F-6, description: "PIXEL: 2N7002 inverting 5 V level shift (470R pull-up) -> 330R -> PIXEL terminal (+5V, DATA, GND). No bulk capacitor on the board: fit 470-1000 uF at the strip input. Long strips get their own 5 V injection"}
  - {id: F-7, description: "Audio: DFPlayer Mini plug-in module on two 1x8 sockets (rows 18.0 mm), microSD slot at the east edge, two-way UART (MCU TX -> 1k -> module RX; module TX -> 1k -> DevKit GPIO34 / Pico GP7, shared with expansion column S6), BUSY to a test pad, SPK terminal (3 W) and a stereo line-out jack"}
  - {id: F-8, description: "UI: USER1-3 tact switches straight to GPIOs (internal pull-ups). RESET, BOOT and the status LED are the MCU board's own"}
  - {id: F-10, description: "Fail-safe: every output, relay and CONTACT driver has a 4.7k pull-down, so outputs are off with no MCU fitted, during reset and in download mode; MCU pins chosen for outputs are quiet at boot"}

interfaces:
  - {id: IF-1, type: "POWER IN: 5.5 x 2.1 mm barrel (2.0 mm pin), centre +, <=5 A, in parallel with a 5.08 mm 2P terminal footprint for supplies up to 10 A", connector: "DC-005-5A-2.0 + 5.08 mm 2P footprint", placement_edge: "N (back)", current_a: "5 barrel / 10 terminal", esd_protection: "SMAJ24A"}
  - {id: IF-2, type: "RAILS: +VIN, +5V, +3V3, GND, GND for a small accessory", connector: "5.08 mm 5P footprint", placement_edge: N, current_a: "+VIN 3; +5V 0.1; +3V3 0.05"}
  - {id: IF-3, type: "TRIG1 (front, west) and TRIG2 (back) 3.5 mm TRS jacks", connector: "PJ-320D SMD", placement_edge: "S (TRIG1), N (TRIG2)", current_a: 0.015}
  - {id: IF-4, type: "USB: on the plug-in MCU board", connector: none on the PCB}
  - {id: IF-5, type: "OUT1-4: 5.08 mm 2P (switched VIN +, GND)", connector: "5.08 mm 2P footprint", placement_edge: "S (front)", current_a: "VIN 12-24 V (derate below 12 V): 5 continuous; 7.5 for 5 s at <=2 % duty from idle (pending heat test); 10 start-up surge < ~1 s; board total 10, barrel 5"}
  - {id: IF-6, type: "RLY1-2: NO COM NC, dry; rev B 120 V AC 5 A (3 A inductive) or 28 V DC 10 A resistive, worded 120VAC 5A (3A IND) / 28VDC 10A (rev A <=30 V DC). Fitted screw terminals >= 250 V, >= 10 A, UL-recognised. DC enclosure: 3.5 mm TRS jacks tip NO, ring NC, sleeve COM, low voltage only, rating limited by the jack; mains never on a 3.5 mm jack", connector: "5.08 mm 3P footprint", placement_edge: S, current_a: "10 DC / 5 AC"}
  - {id: IF-7, type: "CONTACT1, CONTACT2 3.5 mm TRS jacks: isolated contact-closure outputs, tip + / sleeve -", connector: "PJ-320D SMD", placement_edge: "N (back)", current_a: 0.05, v_max: 30}
  - {id: IF-8, type: "PIXEL: +5V, DATA, GND", connector: "5.08 mm 3P footprint", placement_edge: "N (back, west corner)", current_a: 1}
  - {id: IF-9, type: "DFPlayer (card slot at the east edge), SPK (bridge-tied amplifier output, never grounded) and LINE OUT 3.5 mm TRS (tip L, ring R, sleeve GND)", connector: "2 x 1x8 sockets; SPK 5.08 mm 2P; LINE OUT PJ-320D", placement_edge: "E (module, LINE OUT), N (SPK)", current_a: 0.8}
  - {id: IF-10, type: "Expansion: S/V/G 3-row 0.1 in header, 11 positions (I2C SDA/SCL, analog in, spare GPIOs, Pico-only GPIOs), V row 3V3 or 5V by solder jumper, 1k series on each S line; S6 carries the DFPlayer TX (monitor only)", connector: "male pin headers", placement_edge: interior}
  - {id: IF-11, type: "MCU nest: DevKit sockets with the Pico sockets between them, antenna ends at the west edge; no copper under the Pico W antenna keep-out; USB ends reachable", connector: "2.54 mm female sockets, 8.5 mm", placement_edge: "antenna end at a board edge"}

power:
  sources: [{type: "external listed DC supply with its own over-current protection", v_min: 9, v_max: 24, i_max: 10}, {type: "MCU board USB (programming); a B5819W keeps it from back-feeding +5V", v_min: 4.5, v_max: 5.25, i_max: 0.5}]
  rails:
    - {id: PWR-1, name: "+VIN (SMAJ24A TVS, no reverse-polarity FET, no fuses: the supply's OCP protects)", v: "9-24", i_max: 10, copper: "1 oz sized for a 20 C rise (README copper table)"}
    - {id: PWR-2, name: "+5V buck TPS54360B", v: 5, i_max: 2.5, budget: "MCU 0.5 A peaks, DFPlayer 0.8 A peaks, relay coils 0.14 A, PIXEL about 1 A"}
    - {id: PWR-3, name: "+3V3 from the MCU board's regulator", v: 3.3, i_max: 0.1}

mechanical: {id: MECH-1, outline: {shape: rect, w_mm: 134, h_mm: 80}, mounting_holes: "4 x M3 (3.2 mm) at (4,4) (130,4) (4,76) (130,76); H3 (4,76) and H2 (130,4) are plated (MountingHole_3.2mm_M3_Pad, 6.4 mm pad, on GND, bonded solidly into both GND pours: the SAF-2 earth bonding points), H1 and H4 unplated", thickness_mm: 1.6, max_height_top_mm: 25, max_height_bottom_mm: 2.5, keepouts: "no copper under the MCU antennas"}
environment: {temp_class: "0..50 C ambient in an enclosure"}
compliance: {intentional_radiator: "pre-certified MCU modules only", isolation_creepage: "<=26 V DC input. Rev B relay contacts carry up to 120 V AC (F-3): the relay's own coil-to-contact insulation (1500 VAC, basic) first, then each contact island keeps >= 3.0 mm copper clearance to every other net and has a 1.2 mm air-gap slot to the coil pads (SAF-1). A design margin, not a creepage/clearance design to a named safety standard and not a certification; the venue's GFCI outlets are the backstop for earth-leakage faults only (not line-to-neutral overloads or shorts: the 5 A fuse in each relay COM wire covers those), and surface contamination (fog fluid residue, condensation, dust) degrades the insulation over time. Rev A: relay contacts <=30 V DC only"}
manufacturing: {id: MFG-1, fab: JLCPCB, layers: 2, copper_oz: 1, finish: HASL lead-free, assembly_plan: {smt_side: top, two_sided: false}, service: JLC Economic assembly}
usage: {id: USE-1, posture: "enclosure, board on standoffs, lid open for service", bottom_blocked: true, touched_in_place: [edge connectors, USER1-3, the MCU board and its USB, DFPlayer microSD]}
test_and_programming: {programming: "MCU board USB", test_points: "VIN, +5V, +3V3, GND, DFPlayer BUSY"}
safety:
  - {id: SAF-1, description: "Insulation basis for the rev B relay rating of 120 V AC 5 A, 3 A inductive (owner 2026-10-20; 28 V DC 10 A resistive; worded 120VAC 5A (3A IND) / 28VDC 10A). The SRD-05VDC-SL-C body says 250 VAC; the board's AC rating is 120 V and rests first on the relay's coil-to-contact insulation (1500 VAC for 1 min per the Songle datasheet, which claims no reinforced insulation: basic), then on the copper clearance and air-gap slots below. This is a design margin: NOT a creepage/clearance design to any safety standard and NOT a certification. No fuse (AR-1) and no separate relay terminal cover in the enclosure (owner 2026-10-20); the venue's GFCI outlets are the backstop for earth-leakage faults only (they do not trip on line-to-neutral overloads or shorts), so a 5 A fuse goes in each relay's COM wire, user-installed, off the board. If either relay carries mains, both relays' wiring is treated as mains (the gap between the islands is the only barrier); relay mains is disconnected before USB is plugged in or the board is serviced. Users must understand that surface contamination (fog fluid residue, condensation, dust) degrades the insulation over time. Rev A has none of this and stays <=30 V DC: rev A is <=30 V DC rated; AC on rev A relays is experimental, for prove-out only, not considered safe, and recommended against until rev B.",
     criteria: [
       "Contact-island copper of each relay (nets R{n}_COM, R{n}_NO, R{n}_NC: pads, terminal pins, tracks) keeps >= 3.0 mm copper clearance to every net outside that island, on F and on B, including the GND pours; RLY1's island to RLY2's island also >= 3.0 mm. Copper inside one island keeps the normal clearance. Proven by a KiCad custom DRC rule (Freerouting does not see it) and the island measurement in hardware/README.md; aieda's rule() takes no REQ tag, so q reqs does not list this criterion",
       "A non-plated routed slot between COM and each coil pad of each relay, 1.2 mm wide (JLC +/-0.2 mm, so never under the 1.0 mm minimum), running 1 mm past the pad edges at both ends (air gap, as on commercial relay modules). b.slot(between(...)) in board.ts, tagged SAF-1: aieda check slot (width, outline, >= 0.3 mm to copper and fill) is the traced evidence",
     ],
     ceiling: "SRD footprint: COM pad (3 mm) edge to coil pad (2.5 mm) edge is 3.2-3.3 mm, so 3.0 mm is the most this footprint allows; the 1.2 mm slot leaves about 1.0 mm of FR-4 to each pad",
     impact: "Rev A measured 0.2 mm (PWM3 / USER2 under the relay terminals), 0.22-0.35 mm (+5V over K1 COM), 0.25 mm (GND pours) and 1.95 mm (K1 NC to K2 NO). Rev B: relay pitch 17.0 -> 18.1 mm (J_R1/K1 0.9 mm west, J_R2/K2 0.2 mm east; K2 / R_GS1 courtyards now overlap 0.19 mm, waived), buck output caps C_BO1/C_BO2 turned upright and test pads TP2/TP5 moved west out of the K1 moat, PWM3/USER2 run along the front edge south of the terminals, the +5V / +VIN_BK path over K1 moved north into the coil-driver strip, RLY1/RLY2 rerouted through the MCU nest, D_C1 moved between the relays (rotated 180 deg), D_FB1/D_FB2 and the DNP snubbers R_SN1/R_SN2/C_SN1/C_SN2 are removed (F-3; the review measured the COM B track 0.625 mm from the bare C_SN pads, below IPC-2221 B2 of about 1.25 mm for 151-300 V), four 1.2 mm air-gap slots. The enclosure's relay jack positions are wired to the terminals, not mated to them",
     verification: "First-board checks in hardware/README.md: 500 V DC insulation screen >= 100 MOhm (island to low-voltage nets, island to island, across open contacts; again after a fog or humidity soak; a screen, not a 1500 VAC withstand test), slot presence and width >= 1.0 mm, 1 h 5 A 120 V AC heat run with both relays energised and loaded at once in the closed box (bodies 2.6 mm apart; the Songle temperature note assumes >= 10 mm), GFCI trip test, inductive switching on a real fog remote"}
  - {id: SAF-2, description: "Earth bond (owner decisions 2026-10-20 and 2026-10-21, after two independent reviews). Two corner mounting holes are plated MountingHole_3.2mm_M3_Pad (6.4 mm pad on both faces) on GND, each joined solidly to both GND pours (the footprint pad is a solid zone connection, no thermal spokes; b.hole()'s zone keepout under the screw head is removed for both) and to the other layer through its own 3.2 mm plated barrel plus a ring of five 0.4 mm GND vias on a 4.0 mm radius: H3 (4, 76), front-west, bonds the relay side; H2 (130, 4), back-east, bonds the main GND body (power entry, OUT returns, DFPlayer). In the AC case the earth wire lands on BOTH holes with M3 ring terminals under the screws; silk EARTH on both faces marks each. Why two: the relay row and the MCU nest fence the board's GND into a west part and an east part on both layers, so the main body reaches H3 through no more than about 3.1 mm of copper (measured with every reroutable track removed), short of the 5.5 mm target. No jumper and no RC bleed: the rev B solder jumper SJ_E (0.6 mm factory bridge, 1.0 / 0.8 mm tracks, one 0.3 mm via) was removed on the review's finding that it melts at about 28-127 A^2 s, near a 5 A fuse's I^2 t and well under a breaker's. Why bonded: with the earth wires fitted, an insulation fault from a mains-wired relay to the low-voltage side (relay coil-to-contact breakdown or tracking from an island into GND, jack sleeves, the MCU module) has a path to earth, so the 5 A COM fuse, the breaker or the GFCI clears it instead of leaving the low-voltage metal live. Whether the board is earthed depends only on whether the ring terminals are fitted; leaving them off (board GND not earthed) is allowed only when no relay carries mains. Bond capability, from the measured min-cuts below (1 oz, 35 um, so S = cut width x 0.035 mm; Onderdonk, adiabatic, 20 C to 1083 C, I^2 t = 0.0217 x (S in circular mils)^2): relay side about 9.7 kA^2 s, main body about 68 kA^2 s (0.19 mm^2, the 5.5 mm target, is about 3 kA^2 s). A design margin, not a protective-earth conductor sized to a safety standard. Hum note: with GND earthed and LINE OUT feeding an earthed amplifier, a ground loop is possible; the fix is a 3.5 mm ground-loop isolator (transformer) on LINE OUT. More supply filtering does not fix a ground loop: FB_DF, the 100 uF + 100 nF and the Schottky stay as they are. No LINE OUT ground-lift resistor on the board (owner decision 2026-10-20: the plug-in 3.5 mm ground-loop isolator is the only hum fix).",
     criteria: [
       "Min-cut >= 5.5 mm of 1 oz (>= 0.19 mm^2) from relay-adjacent GND (GND copper within 3.6 mm of the R1_* / R2_* island copper) to the H3 pad, F and B, vias counted at pi x drill x 25/35 (the review's raster / max-flow method): measured 9.7 mm",
       "Min-cut >= 5.5 mm from the main GND body (GND in x 85-134, y 0-40 more than 12 mm from H2, plus the J_O1-4, J_IN and J_PWR GND areas) to the H2 pad: measured 25.6 mm",
       "Both earth holes are MountingHole_3.2mm_M3_Pad on GND, solid zone connection on F and B, no zone keepout under the head, five 0.4 mm GND stitching vias each; every other net is kept off the pads (and so out of the screw-head areas) by clearance",
       "Both holes earthed in the AC case (two earth leads with ring terminals)",
       "Both holes and their copper keep >= 3.0 mm from both relay contact islands on F and B (the SAF-1 KiCad rule applies island to every other net; measured in hardware/README.md)",
     ],
     verification: "First-board checks in hardware/README.md: H2 and H3 to GND continuity; ring terminals and screws seat flat on the pads; with the AC case's earth leads fitted, GND to the receptacle earth screw < 1 Ohm at both holes and the GFCI test trips; JLC gerber viewer shows H2 and H3 plated and H1 / H4 non-plated (one mixed-plating drill file)"}

firmware: {applicable: true, mcu_family: "ESP32 (30-pin DevKit) or RP2040 / RP2350 (Pico family)"}
waivers: []
accepted_risks:
  - {risk: AR-1, decision: "No fuse on rev B (owner 2026-10-20)", reason: "A fuse adds cost for little value here: the specified supplies are listed DC supplies with their own over-current protection and shut themselves off on overload or short (PWR-1). Residual risk: a supply without working OCP feeding a fault is limited only by the copper and the supply", applies_to: [PWR-1, IF-1]}
  - {risk: AR-2, decision: "Rev B relay contacts rated 120 V AC 5 A (3 A inductive) / 28 V DC 10 A on the relay insulation and the SAF-1 design margin, without certification, fuse or relay terminal cover (owner 2026-10-20); rev A stays <=30 V DC", reason: "The 3.0 mm contact-island clearance and the 1.2 mm air-gap slots keep a 120 V relay circuit away from the low-voltage copper, but they are not a creepage/clearance design to a safety standard. Residual risk: an insulation fault on a mains-wired relay is cleared only by the venue's GFCI outlet (earth leakage only; overloads and line-to-neutral shorts need the 5 A fuse in each relay COM wire that the docs require); fog fluid residue, condensation and dust on the board lower the insulation over time; open terminals can be touched with the lid open (no terminal cover). Rev A: AC on rev A relays is experimental, for prove-out only, not considered safe, and recommended against until rev B. Not done in rev B: reverse polarity and other rev B items, by owner decision", applies_to: [F-3, IF-6, SAF-1]}
open_questions:
  - {id: OQ-1, question: "10 A per OUT on rev B? (owner to decide; not designed)", would_need: ["a -40 V P-FET with <= 5 mOhm in DFN5x6 or TO-252, with pours on both layers", "about -10 V clamped gate drive", "OUT copper on both layers", "a higher board total, with a wider +VIN trunk and input, if more than one OUT runs at 10 A"]}

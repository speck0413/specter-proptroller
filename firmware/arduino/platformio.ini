; Spectre Proptroller firmware, C++ / Arduino framework.
;
;   pio run -e esp32dev            ESP32 DevKit (30 pin), Wi-Fi
;   pio run -e esp32dev_generic -e esp32s3_generic -e esp32c3_supermini
;                                  bare devkits, no Proptroller board (BARE-DEVKIT.md): ESP32 30-pin DevKit,
;                                  ESP32-S3 DevKit, ESP32-C3 SuperMini, each with its BSP in bsp/
;   pio run -e pico                Raspberry Pi Pico, USB serial only
;   pio run -e picow               Raspberry Pi Pico W (RP2040), Wi-Fi, behind the Pico bootloader
;   pio run -e pico2w              Raspberry Pi Pico 2 W (RP2350), Wi-Fi, behind the Pico bootloader
;   pio run -e boot_rp2040 -e boot_rp2350   the Pico bootloaders; then tools/picoboot_image.py merge pico-w
;                                  (or pico2-w) makes the first-flash flash.uf2 (never `-t upload` on these)
;   pio test -e native             host unit tests (Unity)
;   pio run -e sim && .pio/build/sim/program    simulated board on http://localhost:8080
;
; Board builds use the cores' default -Os; add -O2 to
; build_flags (and build_unflags = -Os) for speed, at a size cost.
;
; The library lives in lib/proptroller (also an Arduino IDE library); src/ holds one small main per board.

[platformio]
default_envs = esp32dev, pico, picow, pico2w, esp32dev_generic, esp32s3_generic, esp32c3_supermini

[common]
lib_deps =
    bblanchon/ArduinoJson@7.4.2
    knolleary/PubSubClient@2.8
build_flags =
    -DARDUINOJSON_USE_LONG_LONG=1
    -fstack-usage
extra_scripts = pre:tools/embed_web.py, pre:tools/strict_flags.py

[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
; the shared flash map (firmware/FLASH-MAP.md): two 1,966,080 B OTA app slots, LittleFS on the partition
; labelled spiffs (128 KB), the stores after it
board_build.partitions = ../partitions/esp32-4mb.csv
; QIO at 80 MHz (owner 2026-10-25), as the Arduino IDE's "ESP32 Dev Module": the step's code runs from flash
; through the cache, and a miss costs about 4 times less than at PlatformIO's DIO 40 MHz default. A board updated
; over the air keeps its bootloader: a DIO one still boots this image (about the DIO 80 MHz speed). QEMU stays DIO.
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.filesystem = littlefs
monitor_speed = 115200
; MQTT without waiting: espMqttClientAsync on AsyncTCP (its task on core 0, below the step's priority: the step is
; core 1, priority 5); no publish is queued while there is no session
lib_deps =
    bblanchon/ArduinoJson@7.4.2
    bertmelis/espMqttClient@1.7.3
    ESP32Async/AsyncTCP@3.5.0
esp32_net_flags = -DCONFIG_ASYNC_TCP_RUNNING_CORE=0 -DCONFIG_ASYNC_TCP_PRIORITY=3 -DEMC_ALLOW_NOT_CONNECTED_PUBLISH=0
; no C++ exceptions, as on the Pico (arduino-pico's default): nothing here throws or catches, and an allocation
; that fails ends in abort() either way; the unwind tables and landing pads cost about 90 KB
; C++17 as on the Pico family and the host (the core's default is gnu++11)
build_flags = ${common.build_flags} -fno-exceptions -std=gnu++17 ${env:esp32dev.esp32_net_flags}
build_unflags = -fexceptions -std=gnu++11
build_src_filter = +<main_wifi.cpp>
extra_scripts = ${common.extra_scripts}, post:tools/stack_post.py

; QEMU only (tools/qemu/run-esp32.sh, QEMU.md): the esp32dev firmware without Wi-Fi, because QEMU has no radio
; and the Wi-Fi driver faults in the PHY init. Never flashed to a board.
[env:esp32dev_qemu]
extends = env:esp32dev
; QEMU's flash model: DIO 40 MHz (tools/qemu/run-esp32.sh merges the image that way)
board_build.flash_mode = dio
board_build.f_flash = 40000000L
build_flags = ${env:esp32dev.build_flags} -DPROPTROLLER_NO_WIFI
; no stack_post.py: the esp32dev build checks the stack paths (stack_check.py knows the board envs only)
extra_scripts = ${common.extra_scripts}

; ---- Bare devkits (firmware/BARE-DEVKIT.md): the stock firmware with a board support package compiled in
; (bsp/<board>/proptroller_board.h), so a board with nothing stored starts on that devkit's pins. Wi-Fi, the phone
; page and updates over the air as on esp32dev, on the same 4 MB flash map (firmware/FLASH-MAP.md). No
; stack_post.py: the stack paths are those of esp32dev, checked there (stack_check.py knows the board envs only).
; Your own board: copy a bsp/ folder and add an env that extends one of these with -I bsp/<yours>.

; ESP32 30-pin DevKit, bare: the esp32dev image (QIO 80 MHz) with the bare map
[env:esp32dev_generic]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -I bsp/esp32-devkit-bare
extra_scripts = ${common.extra_scripts}

; ESP32-S3 DevKit (DevKitC-1 style). Built for 4 MB of flash and no PSRAM, so it runs on every S3 devkit
; (N4 ... N16, with or without PSRAM; the rest of a bigger flash stays unused). Flash at DIO 80 MHz: it works with
; every quad flash chip of the clones; QIO would make the code read from flash faster (unmeasured here). The serial
; port is UART0 behind the board's USB bridge (the port marked UART / COM): ARDUINO_USB_CDC_ON_BOOT=0.
[env:esp32s3_generic]
platform = ${env:esp32dev.platform}
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = ../partitions/esp32-4mb.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps = ${env:esp32dev.lib_deps}
base_flags = ${common.build_flags} -fno-exceptions -std=gnu++17 ${env:esp32dev.esp32_net_flags} -DARDUINO_USB_CDC_ON_BOOT=0
build_flags = ${env:esp32s3_generic.base_flags} -I bsp/esp32-s3-devkit
build_unflags = ${env:esp32dev.build_unflags}
build_src_filter = +<main_wifi.cpp>
extra_scripts = ${common.extra_scripts}

; QEMU only (tools/qemu/run-esp32.sh --s3, QEMU.md): the bare S3 image without Wi-Fi (QEMU has no radio). Never flashed.
[env:esp32s3_qemu]
extends = env:esp32s3_generic
; QEMU's esp32s3 machine has no LEDC and no RMT (PROPTROLLER_QEMU_NO_LEDC: OUT1-4 on / off only, no pixel driver)
build_flags = ${env:esp32s3_generic.build_flags} -DPROPTROLLER_NO_WIFI -DPROPTROLLER_QEMU_NO_LEDC

; ESP32-C3 SuperMini: single core (RISC-V, 160 MHz), 4 MB flash in the chip, the USB port built in (USB-CDC: the
; serial port is the chip's own USB, ARDUINO_USB_MODE=1 + ARDUINO_USB_CDC_ON_BOOT=1). Flash at DIO 80 MHz (the
; clones' flash chips vary; DIO works on all of them). The step runs on the one core above the network's tasks
; (Proptroller.cpp PT_STEP_CORE); the 1 ms samples are latched by the timer interrupt as on the ESP32.
[env:esp32c3_supermini]
platform = ${env:esp32dev.platform}
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = ../partitions/esp32-4mb.csv
board_upload.flash_size = 4MB
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps = ${env:esp32dev.lib_deps}
base_flags = ${common.build_flags} -fno-exceptions -std=gnu++17 ${env:esp32dev.esp32_net_flags} -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
build_flags = ${env:esp32c3_supermini.base_flags} -I bsp/esp32-c3-supermini
build_unflags = ${env:esp32dev.build_unflags}
build_src_filter = +<main_wifi.cpp>
extra_scripts = ${common.extra_scripts}

[rp2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
framework = arduino
board_build.core = earlephilhower
; the call graph with each function's frame (.ci files), read by tools/stack_check.py (GCC >= 10; the ESP32's
; GCC 8 has only -fstack-usage)
stack_flags = -fcallgraph-info=su
lib_deps = ${common.lib_deps}
extra_scripts = ${common.extra_scripts}, post:tools/stack_post.py

; the plain Pico (USB only, no update target): arduino-pico's own map (FLASH-MAP.md), LittleFS 256 KB
[env:pico]
extends = rp2
board = rpipico
board_build.filesystem_size = 256k
build_flags = ${common.build_flags} ${rp2.stack_flags}
build_src_filter = +<main_usb.cpp>

; Pico W / Pico 2 W: behind the Pico bootloader (PICO-BOOTLOADER.md, firmware/FLASH-MAP.md). The firmware is linked
; for the active slot at 0x10007000 (tools/picoboot_ld.py makes the linker script from arduino-pico's and checks
; the image after the build); an update is written to the dfu slot and swapped in by the bootloader, which swaps
; it back if the new image never marks itself good. LittleFS is 188 KB before the EEPROM sector
; (lib/proptroller/src/proptroller/picoboot_map.h): only the records. First flash: the merged flash.uf2
; (tools/picoboot_image.py merge pico-w); `pio run -t upload` is refused (tools/picoboot_no_upload.py).
[picoboot]
extra_scripts = pre:tools/picoboot_ld.py, ${rp2.extra_scripts}, post:tools/picoboot_no_upload.py

[env:picow]
extends = rp2
board = rpipicow
board_build.filesystem_size = 188k
build_flags = ${common.build_flags} ${rp2.stack_flags}
build_src_filter = +<main_wifi.cpp>
extra_scripts = ${picoboot.extra_scripts}

[env:pico2w]
extends = rp2
board = rpipico2w
board_build.filesystem_size = 188k
build_flags = ${common.build_flags} ${rp2.stack_flags}
build_src_filter = +<main_wifi.cpp>
extra_scripts = ${picoboot.extra_scripts}

; The Pico bootloader (PICO-BOOTLOADER.md): bare metal, no Arduino framework; src/picoboot + lib/picoboot + the
; pico-sdk flash / watchdog code of the installed arduino-pico package (tools/picoboot_boot.py). Built only on
; request (not a default env): pio run -e boot_rp2040 -e boot_rp2350
[env:boot_rp2040]
platform = ${rp2.platform}
board = rpipicow
build_src_filter = -<*> +<picoboot/>
lib_deps =
lib_ldf_mode = chain
; only lib/picoboot: picoboot_map.h is included by path from the proptroller library, which is not built here
lib_ignore = Proptroller
extra_scripts = pre:tools/picoboot_boot.py, post:tools/picoboot_no_upload.py
; the firmware's toolchain (GCC of arduino-pico, the one libpico.a is built with) instead of the platform's
; default for bare-metal builds (build a Pico firmware env first so it is installed)
platform_packages = toolchain-gccarmnoneeabi@symlink://${platformio.packages_dir}/toolchain-rp2040-earlephilhower
; the platform's bare-metal defaults that do not fit (libpico.a is soft-float ABI; no newlib specs needed)
build_unflags = --specs=nano.specs --specs=nosys.specs -mfloat-abi=hard -nostdlib

[env:boot_rp2350]
platform = ${rp2.platform}
board = rpipico2w
build_src_filter = -<*> +<picoboot/>
lib_deps =
lib_ldf_mode = chain
; only lib/picoboot: picoboot_map.h is included by path from the proptroller library, which is not built here
lib_ignore = Proptroller
extra_scripts = pre:tools/picoboot_boot.py, post:tools/picoboot_no_upload.py
; the firmware's toolchain (GCC of arduino-pico, the one libpico.a is built with) instead of the platform's
; default for bare-metal builds (build a Pico firmware env first so it is installed)
platform_packages = toolchain-gccarmnoneeabi@symlink://${platformio.packages_dir}/toolchain-rp2040-earlephilhower
; the platform's bare-metal defaults that do not fit (libpico.a is soft-float ABI; no newlib specs needed)
build_unflags = --specs=nano.specs --specs=nosys.specs -mfloat-abi=hard -nostdlib

[native_base]
platform = native
lib_deps = bblanchon/ArduinoJson@7.4.2
build_flags = ${common.build_flags} -std=gnu++17 -O2 -Wall
extra_scripts = ${common.extra_scripts}

[env:native]
extends = native_base
test_framework = unity
build_src_filter = -<*>
test_build_src = no

; the host tests under AddressSanitizer, UndefinedBehaviorSanitizer and LeakSanitizer, with libstdc++'s
; assertions (bounds checks on [] and friends): `pio test -e native_asan`
[env:native_asan]
extends = env:native
build_flags = ${native_base.build_flags} -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined,leak
    -fno-sanitize-recover=all -D_GLIBCXX_ASSERTIONS
build_unflags = -O2
extra_scripts = ${common.extra_scripts}, post:tools/sanitize_link.py

; libFuzzer with clang (test/fuzz_harnesses.h): `tools/fuzz.sh [seconds] [target ...]`; one by hand:
;   pio run -e fuzz && PT_FUZZ_TARGET=request .pio/build/fuzz/program <corpus dir> -max_total_time=60
; ThreadSanitizer: the tests with real threads (test_threads), as the boards' tasks share the controller
[env:native_tsan]
extends = env:native
build_flags = ${native_base.build_flags} -O1 -g -fno-omit-frame-pointer -fsanitize=thread
build_unflags = -O2
extra_scripts = ${common.extra_scripts}, post:tools/tsan_link.py

[env:fuzz]
extends = native_base
build_src_filter = +<fuzz_main.cpp>
; on every object, the libraries' too; PT_FUZZ_FLAGS adds flags (tools/fuzz_env.py)
build_flags = ${native_base.build_flags} -g -O1 -fno-omit-frame-pointer -fsanitize=fuzzer,address,undefined
    -fno-sanitize-recover=undefined -Wno-unknown-warning-option ${sysenv.PT_FUZZ_FLAGS}
build_unflags = -O2
extra_scripts = ${common.extra_scripts}, post:tools/fuzz_env.py

; the simulator talks to a real broker with the ESP32's MQTT session on espMqttClient's POSIX client
[sim_mqtt]
lib_deps = ${native_base.lib_deps}
    bertmelis/espMqttClient@1.7.3
lib_compat_mode = off
lib_ignore = AsyncTCP, ESPAsyncTCP, PubSubClient

[env:sim]
extends = native_base
build_src_filter = +<main_sim.cpp>
build_flags = ${native_base.build_flags} -lpthread
lib_deps = ${sim_mqtt.lib_deps}
lib_compat_mode = ${sim_mqtt.lib_compat_mode}
lib_ignore = ${sim_mqtt.lib_ignore}
; espMqttClient's POSIX client on macOS too (it checks __linux__ only)
extra_scripts = ${native_base.extra_scripts}, pre:tools/emc_posix_apple.py

; the simulator on Windows (MinGW-w64 gcc): Winsock instead of POSIX sockets (net/posix.cpp), no MQTT
; (espMqttClient's host client is POSIX only); -static so program.exe needs no MinGW DLLs beside it
[env:sim_win]
extends = native_base
build_src_filter = +<main_sim.cpp>
build_flags = ${native_base.build_flags} -static -lws2_32

; static analysis (tools/check-static.sh): cppcheck here, clang-tidy (.clang-tidy) on this env's compile commands
[env:check]
extends = native_base
build_src_filter = +<main_sim.cpp>
check_tool = cppcheck
check_src_filters =
    +<lib/proptroller/src/>
    +<src/main_sim.cpp>
    -<lib/proptroller/src/proptroller/web_assets.h>
check_skip_packages = no
check_severity = low, medium, high
check_flags =
    cppcheck: --enable=warning,performance,portability --inline-suppr --suppressions-list=tools/cppcheck-suppressions.txt --std=c++17 --language=c++

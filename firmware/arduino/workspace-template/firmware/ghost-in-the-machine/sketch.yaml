# Arduino IDE / arduino-cli profile: the board and pinned versions (make_envs.py reads the fqbn).
default_profile: esp32dev
profiles:
  esp32dev:
    fqbn: esp32:esp32:esp32
    platforms:
      - platform: esp32:esp32 (2.0.17)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - ArduinoJson (7.4.2)
      - espMqttClient (1.7.3)
      - Async TCP (3.5.0)
      - dir: ../../../lib/proptroller

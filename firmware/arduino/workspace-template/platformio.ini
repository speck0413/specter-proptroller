; My Props: one PlatformIO env per firmware project (firmware/<name>/<name>.ino). Pick the project in the
; PlatformIO env selector (status bar), then Build / Upload. After adding a project: python3 make_envs.py.
;
; The board sections match the stock firmware (firmware/FLASH-MAP.md): the same partition table, LittleFS sizes
; and Pico bootloader linking, so a board keeps its settings, shows and show script when it moves between the
; stock firmware and yours. A Pico W / Pico 2 W's first flash is the merged flash.uf2 (README.md).

[platformio]
src_dir = firmware

[proptroller]
; where firmware/arduino of the Spectre Proptroller repository is (the library and the build scripts)
dir = ..

[common]
lib_extra_dirs = ${proptroller.dir}/lib
lib_deps =
    bblanchon/ArduinoJson@7.4.2
    knolleary/PubSubClient@2.8
build_flags = -DARDUINOJSON_USE_LONG_LONG=1
; each env builds firmware/<custom_project>/ (project_src.py)
extra_scripts = pre:project_src.py

[board_esp32dev]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
board_build.partitions = ${proptroller.dir}/../partitions/esp32-4mb.csv
board_build.filesystem = littlefs
monitor_speed = 115200
lib_extra_dirs = ${common.lib_extra_dirs}
; MQTT on the ESP32: espMqttClientAsync on AsyncTCP (never waits on the broker; AsyncTCP's task on core 0)
lib_deps =
    bblanchon/ArduinoJson@7.4.2
    bertmelis/espMqttClient@1.7.3
    ESP32Async/AsyncTCP@3.5.0
extra_scripts = ${common.extra_scripts}
build_flags = ${common.build_flags} -fno-exceptions -std=gnu++17 -DCONFIG_ASYNC_TCP_RUNNING_CORE=0 -DCONFIG_ASYNC_TCP_PRIORITY=3 -DEMC_ALLOW_NOT_CONNECTED_PUBLISH=0
build_unflags = -fexceptions -std=gnu++11

[rp2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
lib_extra_dirs = ${common.lib_extra_dirs}
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}
extra_scripts = ${common.extra_scripts}

; Pico W / Pico 2 W: behind the Pico bootloader (linked for its active slot; `-t upload` is refused)
[board_picow]
extends = rp2
board = rpipicow
board_build.filesystem_size = 188k
extra_scripts = ${common.extra_scripts}, pre:${proptroller.dir}/tools/picoboot_ld.py, post:${proptroller.dir}/tools/picoboot_no_upload.py

[board_pico2w]
extends = rp2
board = rpipico2w
board_build.filesystem_size = 188k
extra_scripts = ${common.extra_scripts}, pre:${proptroller.dir}/tools/picoboot_ld.py, post:${proptroller.dir}/tools/picoboot_no_upload.py

; the plain Pico (USB only): arduino-pico's own map
[board_pico]
extends = rp2
board = rpipico
board_build.filesystem_size = 256k

; ---- projects: written by make_envs.py from firmware/*/sketch.yaml (do not edit below) ----

[env:ghost-in-the-machine]
extends = board_esp32dev
custom_project = ghost-in-the-machine

[env:tracking-babies]
extends = board_picow
custom_project = tracking-babies

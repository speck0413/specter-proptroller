; QEMU only (QEMU.md "Network"): the esp32dev firmware with the network on QEMU's OpenCores Ethernet instead of
; Wi-Fi (QEMU has no radio). The Arduino core is built here as an ESP-IDF component (IDF 4.4.7, the version the
; core's prebuilt libraries come from) so that CONFIG_ETH_USE_OPENETH can be turned on (sdkconfig.defaults).
; Never flashed to a board. Built by tools/qemu/run-esp32.sh --net:  pio run -d tools/qemu/eth
[platformio]
lib_dir = ../../../lib

[env:esp32dev_qemu_eth]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino, espidf
board_build.partitions = ../../../../partitions/esp32-4mb.csv
board_build.filesystem = littlefs
lib_deps =
    bblanchon/ArduinoJson@7.4.2
    bertmelis/espMqttClient@1.7.3
    ESP32Async/AsyncTCP@3.5.0
build_flags = -DARDUINOJSON_USE_LONG_LONG=1 -DPROPTROLLER_QEMU_ETH -std=gnu++17 -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DCONFIG_ASYNC_TCP_PRIORITY=3 -DEMC_ALLOW_NOT_CONNECTED_PUBLISH=0
build_unflags = -std=gnu++11
extra_scripts = pre:version.py

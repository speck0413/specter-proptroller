paragraph=Build a whole effect in a few lines (when TRIG1 is pressed, play a sound and switch OUT1 on for 2 seconds), or program shows from a phone with no code. Safe by default: outputs off at boot, a trigger held at power-on never triggers, no retrigger while running. ESP32 DevKit (Wi-Fi), Raspberry Pi Pico (USB), Pico W and Pico 2 W (Wi-Fi).
